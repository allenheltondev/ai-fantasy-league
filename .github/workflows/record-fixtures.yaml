name: Record fixtures

# Records real Sleeper responses where api.sleeper.app is reachable, and checks
# which news RSS feeds respond. Dev sandboxes cannot reach either, so this is how
# fixtures and the feed list get refreshed.
#
# By default only the scoring validation sets (fixtures/sleeper/scoring/) are
# recorded. The curated fixtures the unit tests pin (players, state, stats,
# projections, trending) are re-recorded only when `curated` is on: a live
# recording moves the NFL state and the numbers, so expect to update tests. The recorded fixtures are uploaded as an artifact and, unless
# `push_branch` is off, also committed to a `fixtures/run-<run id>` branch so a
# PR can be opened from it without downloading anything. Nothing is pushed to
# main. No AWS credentials are used.

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season to record stats and projections for
        required: false
        type: string
        default: '2025'
      weeks:
        description: Comma-separated weeks to record
        required: false
        type: string
        default: '1,2'
      scoring_weeks:
        description: Comma-separated weeks to record scoring validation sets for (every player)
        required: false
        type: string
        default: '1,2'
      curated:
        description: Also re-record the curated unit-test fixtures (players, state, stats, projections, trending); tests pin their values
        required: false
        type: boolean
        default: false
      espn_event:
        description: Also record ESPN's game summary (scoring plays) for this ESPN event id (optional, uploaded only)
        required: false
        type: string
        default: ''
      push_branch:
        description: Commit the recorded Sleeper fixtures to a fixtures/run-<run id> branch
        required: false
        type: boolean
        default: true

permissions:
  # write only to push the fixtures/run-* branch; main is never pushed.
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  record:
    name: Record Sleeper fixtures and check news feeds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Start from the committed fixtures
        # Keeps the curated fixtures and the synthetic 900xx players unless `curated` is on.
        run: |
          mkdir -p recorded
          cp -R packages/data/fixtures recorded/fixtures
      - name: Record curated Sleeper fixtures
        if: ${{ inputs.curated }}
        env:
          SEASON: ${{ inputs.season }}
          WEEKS: ${{ inputs.weeks }}
        run: node scripts/record-fixtures.mjs --sleeper --season "$SEASON" --weeks "$WEEKS" --out recorded/fixtures
      - name: Record Sleeper scoring validation sets
        # Every player's stat line with Sleeper's pts_ppr / pts_half_ppr / pts_std, written to
        # fixtures/sleeper/scoring/ for the scoring harness (#30, docs/rules.md).
        env:
          SEASON: ${{ inputs.season }}
          WEEKS: ${{ inputs.scoring_weeks }}
        run: node scripts/record-fixtures.mjs --scoring --sleeper --season "$SEASON" --weeks "$WEEKS" --out recorded/fixtures
      - name: Record an ESPN game summary
        # The scoring plays fixture (#164), hand-written until a live payload is recorded.
        if: ${{ inputs.espn_event != '' }}
        continue-on-error: true
        env:
          ESPN_EVENT: ${{ inputs.espn_event }}
        run: node scripts/record-fixtures.mjs --espn-summary "$ESPN_EVENT" --out recorded/fixtures
      - name: Check news feeds
        # A feed outage must not lose the recorded fixtures.
        continue-on-error: true
        run: node scripts/check-news-feeds.mjs --out recorded/news-feeds-report.json
      - name: Upload recorded fixtures
        uses: actions/upload-artifact@v4
        with:
          name: recorded-fixtures-${{ github.run_id }}
          path: |
            recorded/fixtures/sleeper/
            recorded/fixtures/espn/
            recorded/news-feeds-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Push recorded fixtures to a branch
        if: ${{ inputs.push_branch }}
        env:
          BRANCH: fixtures/run-${{ github.run_id }}
          SEASON: ${{ inputs.season }}
          WEEKS: ${{ inputs.weeks }}
          SCORING_WEEKS: ${{ inputs.scoring_weeks }}
          CURATED: ${{ inputs.curated }}
        run: |
          rm -rf packages/data/fixtures/sleeper
          cp -R recorded/fixtures/sleeper packages/data/fixtures/sleeper
          if git diff --quiet -- packages/data/fixtures/sleeper && [ -z "$(git ls-files --others --exclude-standard packages/data/fixtures/sleeper)" ]; then
            echo "Recorded fixtures match the committed ones; nothing to push."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add packages/data/fixtures/sleeper
          if [ "$CURATED" = "true" ]; then WHAT="weeks $WEEKS, scoring weeks $SCORING_WEEKS"; else WHAT="scoring weeks $SCORING_WEEKS"; fi
          git commit -m "Record Sleeper fixtures (season $SEASON, $WHAT)"
          git push origin "$BRANCH"
          echo "Pushed $BRANCH: open a PR from it into main." >> "$GITHUB_STEP_SUMMARY"
